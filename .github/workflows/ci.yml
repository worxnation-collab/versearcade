name: CI

# Runs on every pull request and on pushes to main. The verse-pool check is the
# important one here: PR #58 merged from a stale base and silently deleted 246
# verses from src/data/bible/pool.ts, which nothing caught until the Focus
# practice picker started showing "1 verse" per book again. This job fails the
# PR instead.
#
# Since 2026-10-29 it also runs the FULL `npm run build` — every check:* script
# chained into it (trivia, structure, map, quest doors, contrast, the church-
# draft and digest harnesses…) used to run only inside Netlify's build, so a PR
# could go green here and then fail its deploy — and then plays the real app
# once (`npm run smoke`, scripts/smoke.mjs): the daily drop with a reload
# mid-run, the play surviving on disk, and eight screens with no page error.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22: check:church-draft needs Node's native WebSocket.
          node-version: 22
          cache: npm

      # No dependencies needed — the pool check is plain Node. Run it before the
      # install so a lost-verses regression reports fast.
      - name: Verse pool integrity
        run: npm run check:pool

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build, with every check script
        run: npm run build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke — play the app once
        run: npm run smoke

      # The rollout check's mechanical half (scripts/visual-audit.mjs): the main
      # screens at 390px with a dark-skinned character in both figures, and the
      # landing carousel mid-transition. Fails on a page error, a broken image
      # or a page wider than the phone; the screenshots are uploaded either way
      # so a person can LOOK at them.
      - name: Visual audit
        run: npm run visual-audit

      # The wardrobe WORN (scripts/avatar/wardrobe-audit.py): every piece on
      # both figures and all builds over a dark body. Fails on loose fragments
      # or on light-skin leaks that are new or worse than the reviewed
      # baseline; the flagged pieces are drawn zoomed into the artifact.
      - name: Wardrobe audit
        if: always()
        run: |
          pip install --quiet numpy pillow scipy
          python3 scripts/avatar/wardrobe-audit.py --sheet art/.visual-audit/wardrobe

      - name: Upload visual-audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: art/.visual-audit/
          retention-days: 14
