# Deploys Supabase Edge Functions from the repo.
#
# Why this exists: the functions were deployed by hand (CLI on a laptop, or the
# Supabase connector), and the connector has to carry the whole source inline —
# tiktok-gen is ~140KB and does not fit in one call. A merged change to a
# function therefore sat undeployed until somebody remembered. This uploads the
# files from disk, so what runs is byte-for-byte what is on main.
#
# Two rules keep it from doing damage:
#   - On a push it deploys ONLY the functions whose folder changed in that push.
#     A function whose repo copy has drifted from production is never redeployed
#     as a side effect of an unrelated merge.
#   - It only ever deploys folders that exist under supabase/functions/. Two
#     functions that run with verify_jwt OFF (stripe-webhook, username-login)
#     are not in the repo, so nothing here can flip them. A function that IS
#     here runs with verify_jwt ON (the CLI's default) unless supabase/config.toml
#     says otherwise — church-billing is listed there because Stripe calls it
#     with no Supabase session.
#
# Needs one repo secret: SUPABASE_ACCESS_TOKEN (a personal access token from
# supabase.com/dashboard/account/tokens). Without it the job fails with a line
# saying so rather than half-deploying.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy (a folder under supabase/functions), or "all"'
        required: true
        default: tiktok-gen

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: visuppaucpzzigwtqmdd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Pick the functions to deploy
        id: pick
        env:
          INPUT_FN: ${{ github.event.inputs.function }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f\n' | sort)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_FN" = "all" ]; then
              fns="$all"
            elif echo "$all" | grep -qx "$INPUT_FN"; then
              fns="$INPUT_FN"
            else
              echo "::error::No function folder named '$INPUT_FN'. Have: $(echo $all)"
              exit 1
            fi
          else
            # A shared folder (_shared) changing means every function may have changed.
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions | cut -d/ -f3 | sort -u)
            if echo "$changed" | grep -q '^_'; then
              fns="$all"
            else
              fns=$(comm -12 <(echo "$changed") <(echo "$all"))
            fi
          fi
          echo "Deploying: $(echo $fns)"
          echo "fns=$(echo $fns)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.fns != ''
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.fns != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.pick.outputs.fns }}; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
