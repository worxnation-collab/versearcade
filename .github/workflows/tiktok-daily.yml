# The day's three posts, made and scheduled with nobody at the dashboard.
#
# Runs every morning in UTC (05:30 America/New_York — before the verse's
# 07:00 slot in TIKTOK_TZ, with the DST shift absorbed by the hour of slack)
# and on demand. It renders EXACTLY what the dashboard renders
# (scripts/tiktok-daily.mjs bundles the same generators), uploads each video
# to the tiktok bucket and hands it to Ayrshare with the day's per-platform
# copy, scheduled at that post's time of day. See docs/TIKTOK-ENGINE.md.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TIKTOK_RUNNER_TOKEN        required — the runner's own credential for the
#                              tiktok-gen Edge Function (Vault, 0102: copy the
#                              secret's value from Supabase → Vault). It can
#                              make these posts and nothing else.
#   SUPABASE_URL               optional (defaults to the project)
#   SUPABASE_ANON_KEY          optional (the public key the site ships)
# Variables:
#   TIKTOK_TZ                  optional, IANA zone (default America/New_York)
#   TIKTOK_POST_TIMES          optional, e.g. verse=07:00,quiz=12:30,story=19:30
name: tiktok-daily

on:
  schedule:
    # GitHub runs scheduled jobs hours late (09:30 UTC fired at 15:26-16:17
    # for days), which put the 08:00 ET morning post near lunch. 05:30 UTC is
    # 00:30 ET, so even a six-hour delay lands before the morning post; the
    # 09:30 run stays as a retry, and a second run of a day posts nothing twice.
    - cron: '30 5 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Operator's date to make (YYYY-MM-DD, default today in TIKTOK_TZ)"
        required: false
      kinds:
        # EMPTY by default, so a hand-started run picks the day's posts exactly
        # as the schedule does (quiz + verse + myth on a scripted day). A
        # default list here bypassed that on 2026-11-02 and posted the old
        # story with no myth.
        description: 'Comma list of kinds; leave empty for the day as the schedule would make it'
        required: false
        default: ''
      dry_run:
        description: 'Render only — upload and schedule nothing'
        type: boolean
        default: false

concurrency:
  group: tiktok-daily
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The runner image no longer ships ffmpeg, and the transcode to H.264
      # MP4 is what TikTok and Instagram accept.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make and schedule the day's posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TIKTOK_RUNNER_TOKEN: ${{ secrets.TIKTOK_RUNNER_TOKEN }}
          TIKTOK_TZ: ${{ vars.TIKTOK_TZ }}
          POST_TIMES: ${{ vars.TIKTOK_POST_TIMES }}
          DATE: ${{ inputs.date }}
          KINDS: ${{ inputs.kinds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/tiktok-daily.mjs
      - name: Keep the videos and the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-daily-${{ github.run_id }}
          path: .tiktok-daily/out
          retention-days: 14
          if-no-files-found: ignore
