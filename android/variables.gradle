ext {
    // Capacitor 8 minimums. These are not free-floating numbers: Capacitor ties
    // the Android target SDK to its major version, and Google Play requires
    // targetSdk 36 for every new app and update from 31 August 2026. Bumping
    // these without bumping Capacitor (or vice versa) is how the build breaks.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '10.1.1'
    kotlin_version = '2.2.20'
}
