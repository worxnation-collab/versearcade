<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="0.55" stop-color="#9b2ff0"/>
      <stop offset="1" stop-color="#f72fb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="360" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efeaff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#2a0a4a" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- full-bleed opaque background (App Store icons must not be transparent) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- sparkle accents -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M250 250 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/>
    <path d="M792 300 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" opacity="0.8"/>
    <circle cx="180" cy="470" r="7" opacity="0.7"/>
    <circle cx="860" cy="520" r="9" opacity="0.6"/>
  </g>

  <!-- big four-point star above the book -->
  <g filter="url(#sparkGlow)">
    <path d="M512 214
             c 22 96, 44 118, 140 140
             c -96 22, -118 44, -140 140
             c -22 -96, -44 -118, -140 -140
             c 96 -22, 118 -44, 140 -140 z"
          fill="url(#gold)"/>
  </g>

  <!-- open book -->
  <g filter="url(#soft)" transform="translate(0,44)">
    <!-- spine shadow -->
    <path d="M512 632 c -70 -60 -190 -74 -246 -66 l0 -300 c 70 -12 190 -2 246 58 z" fill="url(#page)"/>
    <path d="M512 632 c 70 -60 190 -74 246 -66 l0 -300 c -70 -12 -190 -2 -246 58 z" fill="url(#page)"/>
    <!-- gold page lines -->
    <g stroke="#c9a3ff" stroke-width="8" stroke-linecap="round" opacity="0.8">
      <line x1="322" y1="352" x2="470" y2="378"/>
      <line x1="322" y1="404" x2="470" y2="430"/>
      <line x1="322" y1="456" x2="470" y2="482"/>
      <line x1="554" y1="378" x2="702" y2="352"/>
      <line x1="554" y1="430" x2="702" y2="404"/>
      <line x1="554" y1="482" x2="702" y2="456"/>
    </g>
    <!-- center spine -->
    <path d="M512 574 l0 -282" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
