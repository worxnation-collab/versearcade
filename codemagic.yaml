# Codemagic CI/CD — builds Verse Arcade for iOS on macOS, signs it, and ships it
# to App Store Connect. You run ZERO of this on your Windows machine.
#
# ONE-TIME SETUP (see docs/APP-STORE-SUBMISSION.md for the click-by-click):
#   1. Sign in to https://codemagic.io with your GitHub, add this repo.
#   2. Create an App Store Connect API key (App Store Connect > Users and Access >
#      Integrations > keys), download the .p8, note the Key ID + Issuer ID.
#   3. In Codemagic: Teams/User settings > Integrations > App Store Connect >
#      add the key. Name it exactly:  VerseArcade  (referenced below).
#   4. Push to GitHub. Start this workflow in Codemagic (or it triggers on tag).
#
# Automatic code signing: Codemagic creates the distribution certificate and
# provisioning profile for you from the API key — you never generate certs by hand.

workflows:
  ios-appstore:
    name: Verse Arcade — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VerseArcade   # <-- must EXACTLY match the integration name in Codemagic
    environment:
      # NOTE: no `ios_signing:` block on purpose. That block makes Codemagic
      # auto-FETCH an existing profile before scripts run — and fails the build
      # with "No matching profiles found" when none exists yet. Instead we create
      # the cert + profile explicitly in the "Set up code signing" step below.
      groups:
        - appstore   # Codemagic var group holding the SECRET var CERTIFICATE_PRIVATE_KEY
                     # (an RSA private key) used to create the distribution certificate.
      vars:
        APP_STORE_APPLE_ID: 6798202287       # Verse Arcade's numeric Apple ID (App Store Connect)
        BUNDLE_ID: "com.versearcade.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # --- Backend (Supabase) build-time config, must match .env.local / the web
        # build, else `npm run build` compiles the app in offline LOCAL mode. The
        # anon key is a PUBLIC client key (safe to expose; RLS-protected) and is
        # already shipped in the web bundle, so it lives here rather than a secret.
        VITE_SUPABASE_URL: "https://visuppaucpzzigwtqmdd.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpc3VwcGF1Y3B6emlnd3RxbWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTY1MjEsImV4cCI6MjEwMTQ5MjUyMX0.YP_lJkV8ZD7J-oAqwkhh-6gQ0z1Q7pFR4Nql1NdhSa0"
        VITE_AUTH_REDIRECT_URL: "https://versearcade.org/auth/callback"
        VITE_DEFAULT_TRANSLATION: "BSB"
        # RevenueCat's PUBLIC iOS SDK key (appl_...), which drives Apple in-app
        # purchase (src/lib/iap.ts). Add REVENUECAT_IOS_KEY to the "appstore"
        # variable group in Codemagic. Public by design — it only identifies the
        # app; the secret key stays server-side.
        # UNSET IS SAFE: with no key the app shows no storefront at all, exactly
        # as it does today, rather than a shop that can't take money.
        VITE_REVENUECAT_IOS_KEY: $REVENUECAT_IOS_KEY
      # Capacitor 8 requires Node 22+ and Xcode 26+.
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Build the web app (Vite -> dist/)
        script: npm run build

      - name: Add iOS platform if missing, then sync
        script: |
          set -e
          # --packagemanager CocoaPods is REQUIRED, not decorative. Capacitor 8
          # generates NEW iOS projects with Swift Package Manager by default, and
          # ios/ is regenerated on every build here — so without this flag the
          # project silently becomes SPM, there is no Podfile for the `pod install`
          # step below, and App.xcworkspace (which XCODE_WORKSPACE and
          # xcode-project use-profiles both point at) never exists. The whole
          # signing + archive chain then fails on a working app.
          # Everything downstream detects the choice from disk: `cap sync` picks
          # SPM only when ios/App/CapApp-SPM exists, which CocoaPods never creates.
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager CocoaPods
          fi
          npx cap sync ios
          test -f ios/App/Podfile || { echo "FATAL: no Podfile — iOS project is not CocoaPods"; exit 1; }

      - name: Raise deployment target to 15.0 + make app iPhone-only
        script: |
          # Apple warns (ITMS-90068) that MinimumOSVersion 13.0 will be rejected
          # from Spring 2027; must be >= 15.0. Capacitor 8's own minimum is already
          # 15.0, so this is usually a no-op now — but it matches ANY value rather
          # than the literal 13.0 it used to, because a sed keyed to one template
          # default silently stops working the day the template changes. macOS = BSD sed.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          echo "Deployment target now:" && grep -m1 "IPHONEOS_DEPLOYMENT_TARGET" ios/App/App.xcodeproj/project.pbxproj
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" ios/App/App.xcodeproj/project.pbxproj \
            || { echo "FATAL: deployment target not set to 15.0"; exit 1; }
          # iPhone-only (device family "1"). Capacitor defaults to "1,2" (universal),
          # which forces Apple to require a full 13" iPad screenshot set. This is a
          # phone-first game, so restrict to iPhone. Match any current value.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "[0-9,]*"/TARGETED_DEVICE_FAMILY = "1"/g' ios/App/App.xcodeproj/project.pbxproj
          echo "Device family now:" && grep -m1 "TARGETED_DEVICE_FAMILY" ios/App/App.xcodeproj/project.pbxproj

      - name: Info.plist — URL scheme, encryption declaration, location purpose
        script: |
          set -e
          # cap add ios generates Info.plist with no custom URL scheme, so the
          # OAuth redirect com.versearcade.app://auth/callback can't reopen the app.
          # Delete any existing block first, then add a clean one (no fragile
          # "|| true" that hid failures last time), and ASSERT it landed.
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST" || { echo "Info.plist not found at $PLIST"; ls -R ios/App | head; exit 1; }
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.versearcade.app" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.versearcade.app" "$PLIST"
          echo "== CFBundleURLTypes now ==" && /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
          # Fail the build loudly if the scheme is not present, so we never ship
          # another binary that can't catch the OAuth redirect.
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PLIST" | grep -qx "com.versearcade.app" \
            || { echo "FATAL: URL scheme com.versearcade.app not registered"; exit 1; }
          echo "OK: com.versearcade.app URL scheme registered"
          # Declare the app uses only exempt encryption (standard HTTPS), so App
          # Store Connect never shows the "Missing Compliance" gate on a build.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "OK: ITSAppUsesNonExemptEncryption=false set"
          # The Church tab finds churches near you via navigator.geolocation,
          # which on iOS goes through CoreLocation even inside the WKWebView.
          # iOS refuses (and can terminate) an app that asks for location with no
          # purpose string, and cap add ios regenerates Info.plist without one
          # every build — so it has to be added here, like the URL scheme above.
          # Without it "find churches near me" is dead on device, in a feature a
          # reviewer will certainly tap.
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Verse Arcade uses your location once to find churches near you. It is never stored or shared." "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST" | grep -q "churches near you" \
            || { echo "FATAL: location usage description not set"; exit 1; }
          echo "OK: NSLocationWhenInUseUsageDescription set"

      - name: Generate app icons + splash from assets/
        script: |
          npx --yes @capacitor/assets generate --ios \
            --iconBackgroundColor '#0b0720' \
            --iconBackgroundColorDark '#0b0720' \
            --splashBackgroundColor '#0b0720' \
            --splashBackgroundColorDark '#0b0720'

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set marketing version + build number
        script: |
          set -e
          # TWO different numbers. Apple rejects the UPLOAD if either is wrong, and
          # it rejects it after signing and archiving, ~20 minutes in.
          #
          # 1. CFBundleShortVersionString / MARKETING_VERSION — the version users see.
          #    Once a version is APPROVED its "train" closes, and every later upload
          #    must carry a strictly higher one. 1.0 is live on the App Store, so
          #    re-uploading 1.0 failed builds 22 and 23 with BOTH
          #      90062  "must contain a higher version than that of the previously
          #              approved version [1.0]"
          #      90186  "the train version '1.0' is closed for new build submissions"
          #    Source of truth is package.json "version" — bump it for every release.
          #    ios/ is NOT committed; `cap add ios` regenerates it each build and the
          #    Capacitor template default (MARKETING_VERSION = 1.0) comes back every
          #    time, so it must be patched here — same as the deployment target above.
          #
          # 2. CFBundleVersion / CURRENT_PROJECT_VERSION — the build inside that
          #    version. Must beat any previously UPLOADED build.
          #    get-latest-app-store-build-number returns 0 until a build is on the
          #    actual App Store (TestFlight builds don't count), so it produced "1"
          #    twice -> 409 duplicate. Codemagic's $BUILD_NUMBER always increases.
          APP_VERSION=$(node -p "require('$CM_BUILD_DIR/package.json').version")
          PBXPROJ="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" "$PBXPROJ"
          # Assert it landed in BOTH build configurations (Debug + Release). A silent
          # miss here is another rejected upload 20 minutes from now, so fail loudly.
          APPLIED=$(grep -c "MARKETING_VERSION = $APP_VERSION;" "$PBXPROJ" || true)
          echo "MARKETING_VERSION set to $APP_VERSION in $APPLIED configuration(s)"
          [ "$APPLIED" -ge 2 ] || { echo "FATAL: MARKETING_VERSION not applied"; grep -n MARKETING_VERSION "$PBXPROJ"; exit 1; }
          cd "$CM_BUILD_DIR/ios/App"   # agvtool must run in the Xcode project dir
          agvtool new-version -all "$BUILD_NUMBER"
          echo "Set CFBundleVersion to $BUILD_NUMBER"
          agvtool what-version -terse   # log the applied version

      - name: Set up code signing (creates cert + profile if missing)
        script: |
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY is base64(clean-LF PEM). Base64 is a single
          # line, so the secret survives CI env-var transmission without newline
          # mangling (raw multi-line PEM came through as "not a valid certificate
          # private key"). Decode it to a real PEM file and pass that via @file:.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          openssl rsa -in /tmp/cert_key.pem -check -noout   # fail fast if key is bad
          # --certificate-key creates (or reuses) the distribution certificate from
          # our RSA key; --create also makes the App Store provisioning profile.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # use-profiles must run where the Xcode project lives (ios/App), else it
          # configures nothing and the App target keeps automatic signing —
          # archive then fails with "App requires a provisioning profile".
          cd ios/App
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight upload always happens. Flip submit_to_app_store to true when
        # your listing (screenshots, metadata, privacy) is complete in App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - worxnation@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────────────────
  # ANDROID / GOOGLE PLAY
  # Builds the SAME web app (dist/) into a signed Android App Bundle (.aab) for the
  # Play Store. You run ZERO of this on Windows. The android/ native project IS
  # committed (unlike ios/, which is regenerated), so the OAuth deep-link intent
  # filter, the removed SCHEDULE_EXACT_ALARM permission and the release
  # signingConfig live in the repo and don't need CI patching.
  #
  # TARGET SDK IS A DEADLINE, NOT A PREFERENCE. Google Play requires targetSdk 36
  # for every new app and every update from 31 August 2026 (35 before that), and
  # Capacitor pins the target SDK to its major version — which is why this project
  # is on Capacitor 8. android/variables.gradle holds the numbers; don't raise them
  # without raising Capacitor, and don't raise Capacitor without re-testing iOS.
  #
  # ONE-TIME SETUP (see docs/PLAY-STORE-SUBMISSION.md):
  #   1. Codemagic > Team settings > Code signing identities > Android keystores >
  #      "Generate keystore". Reference name EXACTLY:  versearcade_upload
  #      (Codemagic then exposes CM_KEYSTORE_PATH / _PASSWORD / CM_KEY_ALIAS /
  #      CM_KEY_PASSWORD, which android/app/build.gradle reads for release signing.)
  #   2. Create a Google Play Developer account ($25, one-time) — YOU must do this.
  #   3. In Play Console create the app, then Setup > API access: link a Google
  #      Cloud project + create a service account with "Release manager" access;
  #      download its JSON key.
  #   4. Codemagic > this app > Environment variables: add GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #      = the service-account JSON, group "googleplay", mark Secure. Then uncomment
  #      the google_play publishing block below and set the track.
  #   NOTE: new PERSONAL Play accounts must run a 14-day closed test with 12+
  #   testers before production is unlocked — start on the "internal" track.
  android-googleplay:
    name: Verse Arcade — Android Google Play
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - versearcade_upload   # <-- must EXACTLY match the keystore reference in Codemagic.
                               # REQUIRED: a missing keystore reference fails the build,
                               # and an unsigned AAB is useless to Play anyway.
      # NOTE: `groups:` is commented out on purpose. Codemagic FAILS a build that
      # references a variable group which doesn't exist yet, and `googleplay` only
      # carries GCLOUD_SERVICE_ACCOUNT_CREDENTIALS for the auto-publish block at the
      # bottom of this workflow — which is itself still commented out. Leaving this
      # in would fail the very first Android build for a credential nothing uses.
      # Uncomment it together with the google_play: block, once the group exists.
      # groups:
      #   - googleplay
      vars:
        PACKAGE_NAME: "com.versearcade.app"
        # Same backend config as the web + iOS builds (public anon key; RLS-protected).
        VITE_SUPABASE_URL: "https://visuppaucpzzigwtqmdd.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpc3VwcGF1Y3B6emlnd3RxbWRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTY1MjEsImV4cCI6MjEwMTQ5MjUyMX0.YP_lJkV8ZD7J-oAqwkhh-6gQ0z1Q7pFR4Nql1NdhSa0"
        VITE_AUTH_REDIRECT_URL: "https://versearcade.org/auth/callback"
        VITE_DEFAULT_TRANSLATION: "BSB"
      # Capacitor 8 needs Node 22+ and compiles the Android project at Java 21
      # (see android/app/capacitor.build.gradle, which cap sync regenerates).
      node: 22
      java: 21
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Build the web app (Vite -> dist/)
        script: npm run build

      - name: Add Android platform if missing, then sync
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate app icons + splash from assets/
        script: |
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#0b0720' \
            --iconBackgroundColorDark '#0b0720' \
            --splashBackgroundColor '#0b0720' \
            --splashBackgroundColorDark '#0b0720'

      - name: Assert the store version matches package.json
        script: |
          set -e
          # Two stores, one version number. package.json is the source of truth
          # (the iOS workflow patches MARKETING_VERSION from it); android/ is
          # committed, so versionName is a literal in build.gradle and can drift
          # from it silently. Play would happily accept the mismatch and ship an
          # Android build whose version disagrees with the iOS one — so fail here
          # instead, where it costs 30 seconds rather than a release.
          APP_VERSION=$(node -p "require('$CM_BUILD_DIR/package.json').version")
          GRADLE_VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          echo "package.json=$APP_VERSION  build.gradle=$GRADLE_VERSION"
          [ "$APP_VERSION" = "$GRADLE_VERSION" ] || {
            echo "FATAL: versionName '$GRADLE_VERSION' != package.json version '$APP_VERSION'."
            echo "Bump both together (see CLAUDE.md)."; exit 1; }

      - name: Build signed release AAB
        script: |
          cd android
          # BUILD_NUMBER (monotonic) feeds versionCode via build.gradle. Play rejects
          # a versionCode that isn't strictly greater than any prior upload.
          echo "versionCode will be BUILD_NUMBER=$BUILD_NUMBER"
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - worxnation@gmail.com
        notify:
          success: true
          failure: true
      # ── Enable automatic Play upload AFTER the account + service-account JSON exist ──
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal            # internal | alpha | beta | production
      #   submit_as_draft: true      # first upload must be promoted manually in Play Console
