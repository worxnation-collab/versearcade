# Codemagic CI/CD — builds Verse Arcade for iOS on macOS, signs it, and ships it
# to App Store Connect. You run ZERO of this on your Windows machine.
#
# ONE-TIME SETUP (see docs/APP-STORE-SUBMISSION.md for the click-by-click):
#   1. Sign in to https://codemagic.io with your GitHub, add this repo.
#   2. Create an App Store Connect API key (App Store Connect > Users and Access >
#      Integrations > keys), download the .p8, note the Key ID + Issuer ID.
#   3. In Codemagic: Teams/User settings > Integrations > App Store Connect >
#      add the key. Name it exactly:  VerseArcade ASC  (referenced below).
#   4. Push to GitHub. Start this workflow in Codemagic (or it triggers on tag).
#
# Automatic code signing: Codemagic creates the distribution certificate and
# provisioning profile for you from the API key — you never generate certs by hand.

workflows:
  ios-appstore:
    name: Verse Arcade — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VerseArcade ASC   # <-- must match the integration name in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.versearcade.app
      vars:
        APP_STORE_APPLE_ID: 6798202287       # Verse Arcade's numeric Apple ID (App Store Connect)
        BUNDLE_ID: "com.versearcade.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Build the web app (Vite -> dist/)
        script: npm run build

      - name: Add iOS platform if missing, then sync
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate app icons + splash from assets/
        script: |
          npx --yes @capacitor/assets generate --ios \
            --iconBackgroundColor '#0b0720' \
            --iconBackgroundColorDark '#0b0720' \
            --splashBackgroundColor '#0b0720' \
            --splashBackgroundColorDark '#0b0720'

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set build number (auto-increment from App Store Connect)
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          cd $CM_BUILD_DIR
          agvtool new-version -all $(($LATEST + 1)) || true

      - name: Apply signing profiles to the Xcode project
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight upload always happens. Flip submit_to_app_store to true when
        # your listing (screenshots, metadata, privacy) is complete in App Store Connect.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - worxnation@gmail.com
        notify:
          success: true
          failure: true
