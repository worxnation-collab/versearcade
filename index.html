<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verse Arcade" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Safari's native App Store banner on iOS — the one download nudge that
         costs us no pixels. Keep the id in sync with src/lib/appStore.ts. -->
    <meta name="apple-itunes-app" content="app-id=6798202287" />

    <!-- Home-screen icon (iOS) + PWA manifest (Android/Chrome) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Verse Arcade</title>
    <meta name="description" content="One verse. One shared drop a day. Beat the clock, keep your streak, and actually remember it. It's the Bible, but it's a game." />

    <!-- Social link preview: every link to the site that has no card of its own
         (the daily posts' first comment, a shared verse, the bio links). It used to
         read "can you beat my score?", which is a comparison this app does not make,
         under a link that carries no score. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verse Arcade" />
    <meta property="og:title" content="Verse Arcade — today's Bible verse, as a game" />
    <meta property="og:description" content="One verse a day and five quick questions. Every answer teaches you something. Free, no ads, no account needed to play." />
    <meta property="og:url" content="https://versearcade.org" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Verse Arcade — today's Bible verse, as a game" />
    <meta name="twitter:description" content="One verse a day and five quick questions. Every answer teaches you something. Free, no ads, no account needed to play." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
