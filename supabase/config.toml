# Only what the deploy workflow needs. Every function runs with verify_jwt ON
# (the CLI default) EXCEPT the ones listed here, which are called by a third
# party with no Supabase session. See CLAUDE.md → Deploy.
project_id = "visuppaucpzzigwtqmdd"

[functions.church-billing]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

# The Monday digest's weekly run comes from pg_cron with no session; the
# function checks its own token (and a leader's test checks their JWT).
[functions.church-digest]
verify_jwt = false

# Resend posts bounces and complaints with no session; the function checks the
# Svix signature against RESEND_WEBHOOK_SECRET before reading anything.
[functions.resend-webhook]
verify_jwt = false
