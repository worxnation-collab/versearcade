# XcodeGen spec — `xcodegen` turns this into ComboClock.xcodeproj. The project
# file is generated, not committed, for the same reason `ios/` isn't: a
# hand-merged project.pbxproj is where iOS repos go to die.
name: ComboClock
options:
  bundleIdPrefix: com.versearcade
  deploymentTarget:
    watchOS: "9.0"
packages:
  RoundCore:
    path: RoundCore
targets:
  ComboClock:
    # A single-target, watch-only app (Xcode 14+): no iOS companion needed,
    # and TestFlight takes it as-is.
    type: application
    platform: watchOS
    sources:
      - App
    dependencies:
      - package: RoundCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Combo Clock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.versearcade.comboclock
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: "NO"
    scheme:
      testTargets: []
